<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"> 

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">

    <title>Tic-Tac-Toe</title>
</head>
<body>
    <h2 class="secondary-color" id="subtitle">Let's play:</h2>
    <h1 class="cabin-sketch-bold primary-color">Tic-Tac-Toe</h1>
    <div id="game-container">
        <div id="players-container">
            <div class="player-container" id="pX">
                <div class="profile-select hidden" id="profile-select-X">
                    <img class="select-pic" id="select-mizi" src="public/mizi.jpg" alt="Mizi Profile Picture">
                    <img class="select-pic" id="select-sua" src="public/sua.jpg" alt="Sua Profile Picture">
                    <img class="select-pic" id="select-hyuna" src="public/hyuna.jpg" alt="Hyuna Profile Picture">
                </div>
                <img class="profile-pic" id ="X-pfp" src="public/mizi.jpg" alt="Player X Profile Picture">
                <div class="player-info primary-highlight" id="pX-info">
                    <h3 class="primary-color">Player X :</h3>
                    <input type="text" class="name-input" id="pX-name-input" value="Name">
                </div>
            </div>
            <div class="player-container" id="pO">
                <div class="profile-select hidden" id="profile-select-O">
                    <img class="select-pic" id="select-till" src="public/till.jpg" alt="Till Profile Picture">
                    <img class="select-pic" id="select-ivan" src="public/ivan.jpg" alt="Ivan Profile Picture">
                    <img class="select-pic" id="select-luka" src="public/luka.jpg" alt="Luka Profile Picture">
                </div>
                <img class="profile-pic" id ="O-pfp" src="public/till.jpg" alt="Player O Profile Picture">
                <div class="player-info" id="pO-info">
                    <h3 class="secondary-color">Player O :</h3>
                    <input type="text" class="name-input" id="pO-name-input" value="Name">
                </div>
            </div>
        </div>
        <div id="gameboard">
            <button class="board-spot border-bottom border-right border-tertiary" type="button" id="spot-0"></button>
            <button class="board-spot border-bottom border-right border-left border-tertiary" type="button" id="spot-1"></button>
            <button class="board-spot border-bottom border-left border-tertiary" type="button" id="spot-2"></button>
            <button class="board-spot border-top border-bottom border-right border-tertiary" type="button" id="spot-3"></button>
            <button class="board-spot border-top border-bottom border-right border-left border-tertiary" type="button" id="spot-4"></button>
            <button class="board-spot border-top border-bottom border-left border-tertiary" type="button" id="spot-5"></button>
            <button class="board-spot border-top border-right border-tertiary" type="button" id="spot-6"></button>
            <button class="board-spot border-top border-right border-left border-tertiary" type="button" id="spot-7"></button>
            <button class="board-spot border-top border-left border-tertiary" type="button" id="spot-8"></button>
        </div>
        <div id="game-info">
            <div id="game-result-container">
                <p id="game-result"></p>
            </div>
            <button type="button" id="new-game-btn">Play Again</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
